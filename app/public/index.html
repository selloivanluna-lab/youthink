<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>YouThink</title>

    <!-- iOS Apple Touch Icon (Icono al agregar a pantalla de inicio en iPhone) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />

    <!-- iOS Web App Metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YouThink" />
    <meta name="application-name" content="YouThink" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- The react-native-web recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0a0a0a;
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Modales de React Native Web por encima del reproductor persistente */
      div[aria-modal="true"],
      body > div:has([aria-modal="true"]),
      body > div:has([aria-modal="true"]) > div {
        z-index: 110000 !important;
      }
    </style>
  </head>

  <body>
    <noscript>
      Necesitás habilitar JavaScript para usar YouThink.
    </noscript>
    <div id="root"></div>
  </body>
</html>
