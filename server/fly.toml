app = "quepensabas-bajar-api"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[mounts]
  source = "quepensabas_bajar_data"
  destination = "/data"
