name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:   # permite lanzar el build manualmente desde la UI de GitHub

jobs:
  build:
    name: Build APK (sin EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v4

      # ── 2. Java 17 (requerido por Gradle / React Native) ─────────────────────
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Node + cache de npm ───────────────────────────────────────────────
      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ── 4. Instalar dependencias JS ──────────────────────────────────────────
      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      # ── 5. Expo CLI ──────────────────────────────────────────────────────────
      - name: Instalar Expo CLI
        run: npm install -g expo-cli@latest

      # ── 6. Quitar expo-dev-client (causa la pantalla de dev server en debug) ──
      - name: Quitar expo-dev-client de dependencias
        working-directory: app
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            delete pkg.dependencies['expo-dev-client'];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm install --prefer-offline || true

      # ── 7. Generar proyecto nativo Android (expo prebuild) ───────────────────
      - name: expo prebuild (genera carpeta android/)
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://youthink-1.onrender.com' }}
          EXPO_PUBLIC_QP_TOKEN: ${{ secrets.EXPO_PUBLIC_QP_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}
        run: npx expo prebuild --platform android --no-install --clean

      # ── 8. Cache de Gradle ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 9. Permisos de ejecución para gradlew ────────────────────────────────
      - name: Permisos gradlew
        working-directory: app/android
        run: chmod +x gradlew

      # ── 10. Parchear build.gradle: deshabilitar R8 y usar firma debug ─────────
      # R8 (minify) rompe NewPipe Extractor que usa reflexión intensamente.
      # Sin minificación el APK funciona correctamente.
      - name: Parchear build.gradle (deshabilitar minify + firma debug)
        working-directory: app/android
        run: |
          # Firma: usar debug keystore para no necesitar keystore de producción
          sed -i 's/signingConfig signingConfigs\.release/signingConfig signingConfigs.debug/g' app/build.gradle || true
          # Deshabilitar minificación R8 (rompe NewPipe/reflexión)
          sed -i 's/minifyEnabled enableProguardInReleaseBuilds/minifyEnabled false/g' app/build.gradle || true
          sed -i 's/minifyEnabled true/minifyEnabled false/g' app/build.gradle || true
          # Deshabilitar shrinkResources (requiere minify activo)
          sed -i 's/shrinkResources (minifyEnabled)/shrinkResources false/g' app/build.gradle || true
          sed -i 's/shrinkResources true/shrinkResources false/g' app/build.gradle || true
          echo "--- build.gradle release block ---"
          grep -A 10 'release {' app/build.gradle || true

      # ── 11. Compilar APK Release standalone ──────────────────────────────────
      - name: Compilar APK
        working-directory: app/android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://youthink-1.onrender.com' }}
          EXPO_PUBLIC_QP_TOKEN: ${{ secrets.EXPO_PUBLIC_QP_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 12. Subir APK como artifact ──────────────────────────────────────────
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: youthink-app-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

