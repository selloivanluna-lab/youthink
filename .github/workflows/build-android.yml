name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el APK en un Release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK standalone (Gradle, sin EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Código ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. JDK 17 (Gradle / AGP / NewPipe) ───────────────────────────────────
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Node 22 (RN 0.86 exige >= 20.19.4) ────────────────────────────────
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ── 4. Dependencias JS ───────────────────────────────────────────────────
      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      # ── 5. Quitar expo-dev-client (APK standalone, sin pantalla de dev server)
      - name: Quitar expo-dev-client
        working-directory: app
        run: npm uninstall expo-dev-client --no-save

      # ── 6. Generar android/ desde app.json (incluye autolinking de qp-audio) ──
      - name: expo prebuild
        working-directory: app
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://youthink-1.onrender.com' }}
          EXPO_PUBLIC_QP_TOKEN: ${{ secrets.EXPO_PUBLIC_QP_TOKEN || '7a5df9bf6747453fa4a97c9b55a62145' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://prixtmnilittshdegrxq.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_BeiQBv-HywDeWRd_ydBx_g_K1ZbCRV4' }}
          EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}
        run: npx expo prebuild --platform android --clean --no-install

      # ── 7. Verificar que el módulo nativo qp-audio entró al proyecto ─────────
      - name: Verificar autolinking de qp-audio
        working-directory: app
        run: |
          echo "--- Paquetes Expo detectados ---"
          npx expo-modules-autolinking resolve --platform android | tee /tmp/autolink.json
          grep -q 'expo.modules.qpaudio' /tmp/autolink.json \
            || (echo "ERROR: qp-audio no fue autolinkeado" && exit 1)

      # ── 8. Ajustes de build: sin R8 (NewPipe usa reflexión) y firma debug ────
      - name: Ajustar gradle.properties
        working-directory: app/android
        run: |
          {
            echo ""
            echo "# Generado por GitHub Actions"
            echo "android.enableMinifyInReleaseBuilds=false"
            echo "android.enableShrinkResourcesInReleaseBuilds=false"
          } >> gradle.properties
          grep -A2 'android.enableMinify' gradle.properties

      # ── 9. Cache de Gradle ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-v2-

      # ── 10. Compilar APK release ─────────────────────────────────────────────
      - name: Compilar APK
        working-directory: app/android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://youthink-1.onrender.com' }}
          EXPO_PUBLIC_QP_TOKEN: ${{ secrets.EXPO_PUBLIC_QP_TOKEN || '7a5df9bf6747453fa4a97c9b55a62145' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://prixtmnilittshdegrxq.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_BeiQBv-HywDeWRd_ydBx_g_K1ZbCRV4' }}
          EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --no-build-cache

      # ── 11. Renombrar con versión + número de build ─────────────────────────
      - name: Preparar APK
        id: apk
        working-directory: app
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "ERROR: no se generó ningún APK"; exit 1; fi
          NAME="youthink-v${VERSION}-build-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$NAME"
          SIZE=$(stat -c%s "$NAME")
          echo "APK: $NAME ($((SIZE/1024/1024)) MB)"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "ERROR: APK demasiado chico, el bundle JS no está embebido"; exit 1
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "path=$PWD/$NAME" >> $GITHUB_OUTPUT

      # ── 12. Artifact del run ─────────────────────────────────────────────────
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ── 13. Release público → link de descarga directa ───────────────────────
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.apk.outputs.version }}-${{ github.run_number }}
          name: YouThink v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            APK standalone de YouThink (YouThink / Qué Pensabas Bajar).

            - Búsqueda y descargas contra el backend de Render.
            - Reproducción Android: módulo nativo `qp-audio` (NewPipe) si está
              disponible; si no, WebView con el embed de YouTube (sin depender
              del backend bloqueado).
            - Firmado con keystore de debug: desinstalá la versión anterior antes
              de instalar si Android rechaza la actualización.
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          make_latest: true
